# =============================================================================
# Production stack for pankajpramanik.com — app + Postgres + Redis.
#
# There is deliberately NO Caddy here. This VPS already runs one shared reverse
# proxy at /opt/proxy that fronts every application on the box (JourneyMesh and
# this one). Two Caddies cannot both hold :80 and :443, so this stack publishes
# no host ports at all: it joins the shared `proxy` network and the proxy
# reaches the app over that network by its alias.
#
#   docker network create proxy      # once per VPS, if it does not exist
#   docker compose -f docker-compose.prod.yml up -d
#
# Env comes from a .env file placed next to this file on the server (see
# .env.production.example). NEVER commit that file.
#
# The matching proxy site file is deploy/pankajpramanik.caddy, installed as
# /opt/proxy/sites/pankajpramanik.caddy by deploy/ovh-bootstrap.sh.
#
# APP_IMAGE selects the build. The deploy workflow exports the immutable
# ghcr.io/pankaj2k9/pankajpramanik:sha-<full commit sha> tag; a manual rollback
# names any earlier sha tag the same way:
#
#   APP_IMAGE=ghcr.io/pankaj2k9/pankajpramanik:sha-<commit> \
#     docker compose -f docker-compose.prod.yml up -d app
# =============================================================================

# Pinned project name, so container/volume/network names never depend on the
# directory this file is run from and cannot collide with another stack.
name: pankajpramanik

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/pankaj2k9/pankajpramanik:latest}
    # Stable DNS name on the shared `proxy` network (the network alias below
    # says the same thing; both are kept so either resolves).
    container_name: pankajpramanik-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # All media (migrated + admin uploads in uploads/YYYY/MM/DD) lives in
    # /opt/pankajpramanik/storage on the host. It is a bind mount, not a named
    # volume, so it is plain files you can see, back up and rsync — and no
    # image, `compose up`, or container replacement can remove it. The deploy
    # workflow merges the repo's storage/ into it without overwriting anything.
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    # Internal only. No `ports:` — nothing is published on the host, so the
    # app is reachable solely through shared-caddy over the proxy network.
    expose:
      - "3000"
    # 200 only when the app can reach PostgreSQL (src/app/api/health/route.ts).
    # start_period covers `prisma migrate deploy` + content import on start.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      internal:
      proxy:
        aliases:
          # The name the shared Caddy reverse-proxies to. Changing it means
          # changing /opt/proxy/sites/pankajpramanik.caddy too.
          - pankajpramanik-app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Database and cache stay off the shared network — nothing outside this
    # stack, including the other applications on the VPS, can reach them.
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]

networks:
  internal:
  proxy:
    external: true

volumes:
  pgdata:
  redisdata:
