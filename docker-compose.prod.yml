# =============================================================================
# Production stack for pankajpramanik.com — app + Postgres + Redis.
#
# There is deliberately NO Caddy here. This VPS already runs one shared reverse
# proxy at /opt/proxy that fronts every application on the box (JourneyMesh and
# this one). Two Caddies cannot both hold :80 and :443, so this stack publishes
# no host ports at all: it joins the shared `proxy` network and the proxy
# reaches the app over that network by its alias.
#
#   docker network create proxy      # once per VPS, if it does not exist
#   docker compose -f docker-compose.prod.yml up -d
#
# Env comes from a .env file placed next to this file on the server (see
# .env.production.example). NEVER commit that file.
#
# The matching site block for /opt/proxy/Caddyfile lives in
# deploy/proxy-caddyfile.snippet.
# =============================================================================
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/pankaj2k9/pankajpramanik:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # NOTE: public/uploads (migrated media) is baked into the image and the
    # admin references images by URL, so nothing writes there at runtime —
    # we intentionally do NOT mount a volume over it (an empty volume would
    # hide the baked files). If you later add file uploads, use object
    # storage (S3 / OVH Object Storage) rather than a host volume.
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      internal:
      proxy:
        aliases:
          # The name the shared Caddy reverse-proxies to. Changing it means
          # changing /opt/proxy/Caddyfile too.
          - pankajpramanik-app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Database and cache stay off the shared network — nothing outside this
    # stack, including the other applications on the VPS, can reach them.
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]

networks:
  internal:
  proxy:
    external: true

volumes:
  pgdata:
  redisdata:
