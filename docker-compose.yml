# Local development stack.
#
# Two ways to run it:
#
#   1. Services only (default, fastest feedback loop)
#        docker compose up -d
#        npm run db:migrate && npm run db:seed && npm run dev
#
#   2. Everything in containers, app included
#        docker compose --profile full up -d --build
#
# Host ports are shifted (5433 / 6380) so a native Postgres or Redis on the
# usual ports keeps working. Production lives in docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pankajpramanik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pankajpramanik_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pankajpramanik}
    ports:
      # Bound to loopback on purpose. Published on 0.0.0.0 this database — with
      # the weak default password below — would be reachable from every other
      # machine on the network, including hotel and cafe wifi.
      # Overridable: 5433 avoids a native Postgres on 5432, but another project
      # on the same machine may already hold it. Set DB_PORT to move.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pankajpramanik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback only, same reasoning as the database.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data

  # Only started with `--profile full`. Sources are bind-mounted, so edits on
  # the host trigger Fast Refresh inside the container.
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      # `db` / `redis` are the in-network hostnames — the 5433/6380 host
      # mappings above are for processes running on the host, not here.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pankajpramanik}:${POSTGRES_PASSWORD:-pankajpramanik_dev}@db:5432/${POSTGRES_DB:-pankajpramanik}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      # Anonymous volumes keep container-built artifacts from being shadowed
      # by (or leaking into) the host checkout.
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  pgdata:
  redisdata:
