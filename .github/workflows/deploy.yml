name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: https://pankajpramanik.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply migrations (schema check)
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  deploy:
    # Works with any Ubuntu VPS reachable over SSH:
    # DigitalOcean Droplet, Hetzner Cloud (e.g. CX23 / CPX AMD), etc.
    name: Deploy to server
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/pankajpramanik
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npx prisma migrate deploy
            npm run build
            # standalone output needs static assets alongside the server
            cp -r public .next/standalone/
            cp -r .next/static .next/standalone/.next/
            pm2 reload pankajpramanik --update-env || pm2 start deploy/ecosystem.config.js
            pm2 save
