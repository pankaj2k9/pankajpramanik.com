# Retires JourneyMesh from the shared OVHcloud VPS, once pankajpramanik.com is
# the site that answers there.
#
# Manual trigger only, on purpose. This is a one-time operation against a
# running production application, so it is deliberately NOT wired into the
# deploy workflow — a destructive step that fires on every push to main is one
# bad merge away from being an outage.
#
# The heavy lifting, and every safety check, lives in
# deploy/decommission-journeymesh.sh. This workflow only ships that script to
# the server and runs it.
name: Decommission JourneyMesh

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REMOVE-JOURNEYMESH to proceed'
        required: true
        type: string
      purge_volumes:
        description: 'Also delete its database volumes (IRREVERSIBLE)'
        required: false
        default: false
        type: boolean
      live_url:
        description: 'URL that must return 200 before anything is removed'
        required: false
        default: 'https://pankajpramanik.com'
        type: string

concurrency:
  group: decommission-journeymesh
  cancel-in-progress: false

jobs:
  decommission:
    name: Retire JourneyMesh
    runs-on: ubuntu-latest
    environment: production
    # Second gate. The typed confirmation has to match exactly, so an
    # accidental "Run workflow" click does nothing.
    if: inputs.confirm == 'REMOVE-JOURNEYMESH'
    steps:
      - uses: actions/checkout@v4

      - name: Copy the decommission script to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/decommission-journeymesh.sh
          target: /tmp/pankajpramanik-decommission
          strip_components: 1

      - name: Run it
        uses: appleboy/ssh-action@v1.2.0
        env:
          PURGE: ${{ inputs.purge_volumes }}
          LIVE: ${{ inputs.live_url }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          envs: PURGE,LIVE
          script: |
            set -euo pipefail
            CONFIRM=REMOVE-JOURNEYMESH \
            PURGE_VOLUMES="$([ "$PURGE" = "true" ] && echo yes || echo no)" \
            LIVE_URL="$LIVE" \
              bash /tmp/pankajpramanik-decommission/decommission-journeymesh.sh
            rm -rf /tmp/pankajpramanik-decommission

      - name: Refused
        if: failure()
        run: |
          echo "::warning::The script refused or rolled back. JourneyMesh is"
          echo "::warning::either still running or was restored. Read the log above."
