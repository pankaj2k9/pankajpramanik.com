# Single CI/CD pipeline for pankajpramanik.com.
#
#   pull_request → main   ci → e2e
#   push → main           ci → e2e → publish → deploy
#   workflow_dispatch     ci → e2e → publish → deploy   (publish/deploy only on main)
#
# Every job `needs` the previous one, so an image is never built unless CI
# passed on that exact commit, and production is never touched unless that
# image was built and pushed. There is deliberately no second workflow: a
# separate deploy workflow could race ahead of a failing CI run.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One pipeline per ref. PR runs are superseded by newer pushes; main runs are
# serialized and never cancelled mid-flight (a killed deploy can leave the
# stack half-restarted). A newer pending main run replaces an older pending
# one, which is fine: it contains that commit.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Fixed name, not ghcr.io/${{ github.repository }}: the repo is
  # "pankajpramanik.com", but the server's compose/.env pull
  # ghcr.io/pankaj2k9/pankajpramanik.
  IMAGE: ghcr.io/pankaj2k9/pankajpramanik

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `next build` prerenders pages that read PostgreSQL, and the e2e tests
    # run against the built app, so CI gets a throwaway database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: https://pankajpramanik.com
      ADMIN_EMAIL: ci@example.com
      ADMIN_NAME: CI
      ADMIN_PASSWORD: ci-only-placeholder-pw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The DB must hold the content production will serve, so prerendered
      # pages and tests see real data: seed the baseline, then apply the
      # committed snapshot exported from the local database.
      - name: Seed and import content snapshot
        run: |
          npm run db:seed
          npm run content:import

      - name: Check referenced media exists in storage/
        run: |
          missing=0
          for ref in $(grep -oE '/uploads/[^"'"'"'[:space:])<>?#\\]+' prisma/content/snapshot.json | sort -u); do
            [ -f "storage$ref" ] || { echo "::error::missing storage$ref"; missing=1; }
          done
          exit $missing

      - name: Build
        run: npm run build

  e2e:
    name: E2E tests
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright against the production build (`npm start`), with its own
    # throwaway database. TEST_ENABLE_DB runs the dashboard/contact tests too;
    # they only accept a localhost database and clean up their own rows.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: https://pankajpramanik.com
      ADMIN_EMAIL: ci@example.com
      ADMIN_NAME: CI
      ADMIN_PASSWORD: ci-only-placeholder-pw
      TEST_ENABLE_DB: "true"
      TEST_BASE_URL: http://localhost:3000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npm run content:import

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "App is up."; exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy"; cat server.log; exit 1

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Docker build + publish
    needs: [ci, e2e]
    # Only for main (push or manual run). Implicitly also requires ci + e2e success.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # The immutable full-commit tag pushed below. Not steps.meta.outputs.version:
      # on main that resolves to the highest-priority tag, which is `latest`.
      image: ${{ env.IMAGE }}:sha-${{ github.sha }}
    # `next build` prerenders pages that read PostgreSQL, so provide a
    # throwaway DB, migrate + seed it, then let the Docker build read it
    # over the host network (buildx --network=host).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
      AUTH_SECRET: build-time-only
      AUTH_URL: https://pankajpramanik.com
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: build@example.com
      ADMIN_NAME: Build
      ADMIN_PASSWORD: build-time-placeholder-pw
      NEXT_PUBLIC_SITE_URL: https://pankajpramanik.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Same content as CI, so the image's prerendered pages match production.
      - name: Migrate, seed & import content snapshot
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npm run content:import

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=sha,format=long

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          network: host
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build?schema=public
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the built image exactly as production does — entrypoint runs
      # `prisma migrate deploy` against an EMPTY database, imports content,
      # creates the admin, starts Next — and require /api/health to answer.
      # Nothing is pushed unless this passes.
      - name: Smoke test image
        env:
          SMOKE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --network host postgres:16-alpine \
            psql postgresql://build:build@localhost:5432/build -c 'CREATE DATABASE smoke'
          docker run -d --name smoke --network host \
            -e DATABASE_URL='postgresql://build:build@localhost:5432/smoke?schema=public' \
            -e AUTH_SECRET=smoke-test-only -e AUTH_URL=http://localhost:3000 -e AUTH_TRUST_HOST=true \
            -e ADMIN_EMAIL=smoke@example.com -e ADMIN_NAME=Smoke -e ADMIN_PASSWORD=smoke-test-password \
            -e NEXT_PUBLIC_SITE_URL=https://pankajpramanik.com \
            "$SMOKE_IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then
              echo; echo "Image is healthy."; docker logs smoke | tail -20; docker rm -f smoke; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::container exited during smoke test"; break
            fi
            sleep 2
          done
          echo "::error::image failed smoke test"; docker logs smoke; docker rm -f smoke || true; exit 1

      - name: Push image
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: Deploy production
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Media is persistent server-side storage, not part of the image. Upload
      # the repo's storage/ to a staging directory the deploy user owns; the
      # server script below merges it into the live storage WITHOUT
      # overwriting or deleting anything, so files uploaded in production are
      # never touched. The compose file is shipped too, so changes to it
      # deploy with the code.
      - name: Upload media storage and compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'command -v rsync >/dev/null || { echo "rsync missing on server: sudo apt-get install -y rsync"; exit 1; }; mkdir -p /opt/pankajpramanik/.deploy/storage'
          rsync -rtz --partial -e "$SSH" storage/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/pankajpramanik/.deploy/storage/"
          rsync -tz -e "$SSH" docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/pankajpramanik/.deploy/docker-compose.prod.yml"
          rm -f ~/.ssh/deploy_key

      # This VPS is shared. Other applications run behind the same Caddy at
      # /opt/proxy, so this job is deliberately narrow:
      #   * it only ever names docker-compose.prod.yml in /opt/pankajpramanik
      #   * no `docker compose down`, no `docker system prune`, no network or
      #     volume removal — nothing another app depends on is touched
      #   * it does not edit /opt/proxy; the proxy is configured once by
      #     deploy/ovh-bootstrap.sh and reloaded by hand
      - name: Pull image from GHCR and restart the stack
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # A read:packages PAT, NOT GITHUB_TOKEN. GITHUB_TOKEN dies with the
          # workflow run, so a later manual `docker compose pull` on the box
          # would fail with a 401.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # No `script_stop`: drone-ssh implements it by inserting an exit-code
          # check after EVERY line, which breaks `case`, line continuations and
          # multi-line quoted strings (bash: syntax error near unexpected token
          # `;'). The script's own `set -euo pipefail` stops on the first error.
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF
          script: |
            set -euo pipefail

            APP_DIR=/opt/pankajpramanik
            COMPOSE="docker compose -f docker-compose.prod.yml"
            APP_CONTAINER=pankajpramanik-app
            REPO=ghcr.io/pankaj2k9/pankajpramanik

            case "${IMAGE_REF:-}" in
              "$REPO":sha-*) ;;
              *) echo "::error::refusing to deploy unexpected image reference '${IMAGE_REF:-}'"; exit 1 ;;
            esac

            # Fail loudly rather than bootstrapping half a stack from CI.
            test -d "$APP_DIR" || { echo "::error::$APP_DIR missing — run deploy/ovh-bootstrap.sh first"; exit 1; }
            cd "$APP_DIR"
            test -f .env || { echo "::error::.env missing in $APP_DIR"; exit 1; }

            # Ship the compose file from the repo, keeping the previous copy.
            if ! cmp -s .deploy/docker-compose.prod.yml docker-compose.prod.yml; then
              [ -f docker-compose.prod.yml ] && cp docker-compose.prod.yml "docker-compose.prod.yml.bak-$(date +%Y%m%d%H%M%S)"
              cp .deploy/docker-compose.prod.yml docker-compose.prod.yml
              echo "docker-compose.prod.yml updated"
            fi

            # Created by the bootstrap script and shared with the other apps.
            # Never recreated here — recreating it would detach them from Caddy.
            docker network inspect proxy >/dev/null 2>&1 || {
              echo "::error::shared 'proxy' network missing — run deploy/ovh-bootstrap.sh"; exit 1; }

            # Token goes over stdin (never argv, never echoed); the credential is
            # removed from the server however this script exits.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Record what is running now, so a rollback has a target.
            PREVIOUS=$(docker inspect -f '{{.Config.Image}}' "$APP_CONTAINER" 2>/dev/null || true)
            echo "Currently running: ${PREVIOUS:-none}"
            echo "Deploying: $IMAGE_REF"

            # Pin the exact build from this run (sha tag) so what ships is what
            # was built; shell env wins over APP_IMAGE in .env.
            export APP_IMAGE="$IMAGE_REF"
            $COMPOSE pull app

            # Merge repo media into persistent storage: no-clobber copy, never
            # a delete, then hand ownership to the container user (uid 1001).
            # Runs inside the app image as root, so the deploy user needs no sudo.
            mkdir -p storage
            docker run --rm --user 0 --entrypoint sh \
              -v "$APP_DIR/.deploy/storage:/src:ro" -v "$APP_DIR/storage:/dst" \
              "$APP_IMAGE" \
              -c 'set -e; mkdir -p /dst/uploads; cd /src
                  # busybox cp -n / tar -k abort or skip whole trees on the
                  # first existing file, so copy file by file instead.
                  find . -type d -exec mkdir -p "/dst/{}" ";"
                  find . -type f | while IFS= read -r f; do
                    [ -e "/dst/$f" ] || cp "$f" "/dst/$f"
                  done
                  chown -R 1001:1001 /dst'
            echo "Media in storage: $(find storage -type f | wc -l) files"
            # `up -d` recreates only what changed. On start the entrypoint runs
            # prisma migrate deploy, then imports prisma/content/snapshot.json
            # (skipped when that snapshot was already imported).
            $COMPOSE up -d

            # Wait for the container healthcheck (GET /api/health, which needs
            # PostgreSQL) — checked from inside the container, no public port.
            fail() {
              echo "::error::$1"
              echo "Recent app logs:"
              $COMPOSE logs --tail=80 app || true
              [ -n "$PREVIOUS" ] && echo "::error::Previous image was $PREVIOUS — roll back with: cd $APP_DIR && APP_IMAGE=$PREVIOUS $COMPOSE up -d app"
              exit 1
            }
            for i in $(seq 1 50); do
              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER" 2>/dev/null || echo missing)
              RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$APP_CONTAINER" 2>/dev/null || echo 0)
              RUNNING_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$APP_CONTAINER" 2>/dev/null || echo none)
              echo "[$i] health=$STATUS restarts=$RESTARTS image=$RUNNING_IMAGE"
              [ "$RUNNING_IMAGE" = "$APP_IMAGE" ] || fail "$APP_CONTAINER is running $RUNNING_IMAGE, expected $APP_IMAGE"
              case "$STATUS" in
                healthy) echo "App is healthy."; break ;;
                unhealthy) fail "$APP_CONTAINER reported unhealthy" ;;
                missing|exited|dead) fail "$APP_CONTAINER is $STATUS" ;;
              esac
              [ "$RESTARTS" -lt 3 ] || fail "$APP_CONTAINER restarted $RESTARTS times (usually prisma migrate deploy failing)"
              [ "$i" -lt 50 ] || fail "$APP_CONTAINER not healthy after ~250s"
              sleep 5
            done

            # Keep the locally cached `latest` equal to what is actually deployed,
            # so a manual `docker compose up -d` without APP_IMAGE never silently
            # falls back to an older build. Record the history for rollbacks.
            docker tag "$APP_IMAGE" "$REPO:latest"
            echo "$(date -u +%FT%TZ) $APP_IMAGE" >> "$APP_DIR/.deploy/deployed-images.log"

            # Clean up old builds of THIS image only (never other apps' images):
            # keep the 5 newest; untagging an image a container still uses is
            # refused by `docker rmi` (no -f), so a running build is never removed.
            KEEP=$(docker images "$REPO" --format '{{.ID}}' | awk '!seen[$0]++' | head -5 | tr '\n' ' ')
            docker images "$REPO" --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
              | awk -v keep="$KEEP" 'BEGIN { n = split(keep, k, " "); for (i = 1; i <= n; i++) K[k[i]] = 1 }
                                     !($1 in K) && $2 !~ /:<none>$/ { print $2 }' \
              | xargs -r docker rmi 2>/dev/null || true
