# /etc/nginx/sites-available/pankajpramanik.com
# Reverse proxy for the Next.js app running on 127.0.0.1:3000 (PM2).
# Certbot will rewrite/extend this file when you run:
#   sudo certbot --nginx -d pankajpramanik.com -d www.pankajpramanik.com

server {
    listen 80;
    listen [::]:80;
    server_name pankajpramanik.com www.pankajpramanik.com;

    # allow ACME challenges before HTTPS exists
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 10m;

    # Long-cache immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Migrated WordPress media (served from public/uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
